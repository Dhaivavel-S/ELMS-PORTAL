<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Apply Leave - ELMS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-brand">ELMS Portal</div>
            <ul class="nav-links">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="apply-leave.html" class="active">Apply for Leave</a></li>
                <li><a href="my-leaves.html">My Leaves</a></li>
                <li><a href="leave-history.html">Leave History</a></li>
                <li><a href="profile.html">Profile</a></li>
            </ul>
            <button onclick="logout()" class="btn-primary" style="background:#ef4444;">Logout</button>
        </aside>
        <main class="main-content">
            <div class="glass-card" style="max-width: 600px; margin:0 auto;">
                <h2>Apply For Leave</h2>
                <form id="applyLeaveForm">
                    <div class="form-group">
                        <label>Leave Type</label>
                        <select id="leave_type" class="form-control" required>
                            <option value="Casual Leave">Casual Leave</option>
                            <option value="Sick Leave">Sick Leave</option>
                            <option value="Earned Leave">Earned Leave</option>
                            <option value="Emergency Leave">Emergency Leave</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Start Date</label>
                        <input type="date" id="start_date" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>End Date</label>
                        <input type="date" id="end_date" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Reason for Leave</label>
                        <textarea id="reason" class="form-control" rows="4" required></textarea>
                    </div>
                    <button type="submit" class="btn-primary">Submit Application</button>
                </form>
            </div>
        </main>
    </div>
    <script src="js/auth.js"></script>
    <script src="js/leave.js"></script>
</body>
</html>
