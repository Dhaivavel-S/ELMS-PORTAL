<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ELMS - Register</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-overlay">
    <div class="auth-wrapper">
        <div class="glass-card auth-card">
            <h2>Employee Registration</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label>Employee ID</label>
                    <input type="text" id="employee_id" class="form-control" required placeholder="EMP-102">
                </div>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="full_name" class="form-control" required placeholder="Jane Doe">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" class="form-control" required placeholder="jane@company.com">
                </div>
                <div class="form-group">
                    <label>Department</label>
                    <input type="text" id="department" class="form-control" required placeholder="Engineering">
                </div>
                <div class="form-group">
                    <label>Designation</label>
                    <input type="text" id="designation" class="form-control" required placeholder="Software Engineer">
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select id="role" class="form-control">
                        <option value="EMPLOYEE">Employee</option>
                        <option value="ADMIN">Admin</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary">Register Account</button>
            </form>
            <p style="margin-top: 15px; font-size: 0.9rem; text-align: center; color: var(--text-muted);">
                Already registered? <a href="index.html" style="color: var(--accent-cyan);">Login</a>
            </p>
        </div>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
