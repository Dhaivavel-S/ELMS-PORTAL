<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ELMS - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-overlay">
    <div class="auth-wrapper">
        <div class="glass-card auth-card">
            <h2>Sign In</h2>
            <p style="color: var(--text-muted); margin-bottom: 20px;">Access Employee Leave Portal</p>
            <form id="loginForm">
                <div class="form-group">
                    <label>Corporate Email</label>
                    <input type="email" id="email" class="form-control" required placeholder="name@company.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary">Sign In</button>
            </form>
            <p style="margin-top: 15px; font-size: 0.9rem; text-align: center; color: var(--text-muted);">
                Don't have an account? <a href="register.html" style="color: var(--accent-cyan);">Register Here</a>
            </p>
        </div>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
